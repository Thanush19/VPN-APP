[versions]

# ==========================================
# Build / Kotlin
# ==========================================
agp = "8.4.0"
kotlin = "1.9.23"
compileSdk = "34"
minSdk = "24"
targetSdk = "34"

# ==========================================
# AndroidX
# ==========================================
activity = "1.9.0"
appcompat = "1.7.0"
constraintlayout = "2.1.4"
core-ktx = "1.13.0"
lifecycle = "2.7.0"
material = "1.12.0"
navigation = "2.7.7"
room = "2.6.1"
datastore = "1.1.1"
work = "2.9.0"

# ==========================================
# Compose
# ==========================================
compose-bom = "2024.02.00"
compose-compiler = "1.5.12"
ui = "1.6.1"
ui-graphics = "1.6.1"
ui-tooling = "1.6.1"
ui-test = "1.6.1"
ui-test-manifest = "1.6.1"

# ==========================================
# Hilt
# ==========================================
hilt = "2.48.1"
hilt-navigation-compose = "1.2.0"

# ==========================================
# Retrofit / OkHttp
# ==========================================
retrofit = "2.11.0"
okhttp = "4.12.0"
logging-interceptor = "4.12.0"

# ==========================================
# Kotlinx Serialization
# ==========================================
kotlinx-serialization = "1.6.3"

# ==========================================
# Coroutines
# ==========================================
coroutines = "1.7.3"

# ==========================================
# Testing
# ==========================================
junit = "4.13.2"
junit-jupiter = "5.10.2"
mockk = "1.13.13"
robolectric = "4.11.1"
truth = "1.1.5"
espresso = "3.5.1"
compose-test = "1.6.1"

# ==========================================
# Kotlinx
# ==========================================
kotlinx-datetime = "0.5.0"
kotlinx-coroutines = "1.7.3"

# ==========================================
# Google Play Services
# ==========================================
play-services-auth = "21.0.0"
play-services-safetynet = "18.0.1"

ksp = "1.9.23-1.0.19"
[libraries]

# ==========================================
# AndroidX
# ==========================================

androidx-activity = { module = "androidx.activity:activity-compose", version.ref = "activity" }

androidx-appcompat = { module = "androidx.appcompat:appcompat", version.ref = "appcompat" }

androidx-constraintlayout = { module = "androidx.constraintlayout:constraintlayout", version.ref = "constraintlayout" }

androidx-core-ktx = { module = "androidx.core:core-ktx", version.ref = "core-ktx" }


# ==========================================
# Lifecycle
# ==========================================

androidx-lifecycle-runtime = { module = "androidx.lifecycle:lifecycle-runtime-ktx", version.ref = "lifecycle" }

androidx-lifecycle-viewmodel = { module = "androidx.lifecycle:lifecycle-viewmodel-ktx", version.ref = "lifecycle" }

androidx-lifecycle-viewmodel-compose = { module = "androidx.lifecycle:lifecycle-viewmodel-compose", version.ref = "lifecycle" }


# ==========================================
# Material / Navigation
# ==========================================

androidx-material = { module = "com.google.android.material:material", version.ref = "material" }

androidx-navigation-compose = { module = "androidx.navigation:navigation-compose", version.ref = "navigation" }


# ==========================================
# Room
# ==========================================

androidx-room-runtime = { module = "androidx.room:room-runtime", version.ref = "room" }

androidx-room-compiler = { module = "androidx.room:room-compiler", version.ref = "room" }

androidx-room-ktx = { module = "androidx.room:room-ktx", version.ref = "room" }


# ==========================================
# DataStore / WorkManager
# ==========================================

androidx-datastore = { module = "androidx.datastore:datastore-preferences", version.ref = "datastore" }

androidx-work-runtime = { module = "androidx.work:work-runtime-ktx", version.ref = "work" }


# ==========================================
# Compose
# ==========================================

compose-bom = { module = "androidx.compose:compose-bom", version.ref = "compose-bom" }

compose-ui = { module = "androidx.compose.ui:ui", version.ref = "ui" }

compose-ui-graphics = { module = "androidx.compose.ui:ui-graphics", version.ref = "ui-graphics" }

compose-ui-tooling = { module = "androidx.compose.ui:ui-tooling", version.ref = "ui-tooling" }

compose-ui-tooling-preview = { module = "androidx.compose.ui:ui-tooling-preview", version.ref = "ui-tooling" }

compose-ui-test = { module = "androidx.compose.ui:ui-test-junit4", version.ref = "ui-test" }

compose-ui-test-manifest = { module = "androidx.compose.ui:ui-test-manifest", version.ref = "ui-test-manifest" }

compose-material3 = { module = "androidx.compose.material3:material3" }

compose-material3-adaptive = { module = "androidx.compose.material3:material3-adaptive" }

compose-material-icons-extended = { module = "androidx.compose.material:material-icons-extended" }

compose-runtime = { module = "androidx.compose.runtime:runtime" }

compose-runtime-livedata = { module = "androidx.compose.runtime:runtime-livedata" }

compose-runtime-rxjava2 = { module = "androidx.compose.runtime:runtime-rxjava2" }

compose-foundation = { module = "androidx.compose.foundation:foundation" }

compose-foundation-layout = { module = "androidx.compose.foundation:foundation-layout" }

compose-animation = { module = "androidx.compose.animation:animation" }

compose-animation-core = { module = "androidx.compose.animation:animation-core" }


# ==========================================
# Hilt
# ==========================================

hilt-android = { module = "com.google.dagger:hilt-android", version.ref = "hilt" }

hilt-compiler = { module = "com.google.dagger:hilt-compiler", version.ref = "hilt" }

hilt-navigation-compose = { module = "androidx.hilt:hilt-navigation-compose", version.ref = "hilt-navigation-compose" }


# ==========================================
# Retrofit / OkHttp
# ==========================================

retrofit = { module = "com.squareup.retrofit2:retrofit", version.ref = "retrofit" }

retrofit-kotlinx-serialization = { module = "com.squareup.retrofit2:converter-kotlinx-serialization", version.ref = "retrofit" }

okhttp = { module = "com.squareup.okhttp3:okhttp", version.ref = "okhttp" }

logging-interceptor = { module = "com.squareup.okhttp3:logging-interceptor", version.ref = "logging-interceptor" }


# ==========================================
# Kotlinx Serialization
# ==========================================

kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "kotlinx-serialization" }


# ==========================================
# Coroutines
# ==========================================

kotlinx-coroutines-android = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-android", version.ref = "coroutines" }

kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "coroutines" }


# ==========================================
# Testing
# ==========================================

junit = { module = "junit:junit", version.ref = "junit" }

junit-jupiter = { module = "org.junit.jupiter:junit-jupiter", version.ref = "junit-jupiter" }

mockk = { module = "io.mockk:mockk", version.ref = "mockk" }

robolectric = { module = "org.robolectric:robolectric", version.ref = "robolectric" }

truth = { module = "com.google.truth:truth", version.ref = "truth" }

espresso-core = { module = "androidx.test.espresso:espresso-core", version.ref = "espresso" }

espresso-contrib = { module = "androidx.test.espresso:espresso-contrib", version.ref = "espresso" }

androidx-test-core = { module = "androidx.test:core", version.ref = "espresso" }

androidx-test-runner = { module = "androidx.test:runner", version.ref = "espresso" }

androidx-test-rules = { module = "androidx.test:rules", version.ref = "espresso" }

compose-test = { module = "androidx.compose.ui:ui-test-junit4", version.ref = "compose-test" }


# ==========================================
# Kotlinx
# ==========================================

kotlinx-datetime = { module = "org.jetbrains.kotlinx:kotlinx-datetime", version.ref = "kotlinx-datetime" }

kotlinx-serialization = { module = "org.jetbrains.kotlinx:kotlinx-serialization-core", version.ref = "kotlinx-serialization" }

# ==========================================
# WireGuard
# ==========================================

wireguard-android = { module = "com.wireguard.android:wireguard-android", version = "1.0.20230914" }


# ==========================================
# Google Play Services
# ==========================================

play-services-auth = { module = "com.google.android.gms:play-services-auth", version.ref = "play-services-auth" }

play-services-safetynet = { module = "com.google.android.gms:play-services-safetynet", version.ref = "play-services-safetynet" }


[plugins]

# ==========================================
# Android
# ==========================================

android-application = { id = "com.android.application", version.ref = "agp" }

android-library = { id = "com.android.library", version.ref = "agp" }


# ==========================================
# Kotlin
# ==========================================

kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }

kotlin-multiplatform = { id = "org.jetbrains.kotlin.multiplatform", version.ref = "kotlin" }

kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }


# ==========================================
# Hilt
# ==========================================

hilt = { id = "com.google.dagger.hilt.android", version.ref = "hilt" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
