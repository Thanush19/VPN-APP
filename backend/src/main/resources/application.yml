# Development profile
spring:
  config:
    activate:
      on-profile: dev
  datasource:
    url: jdbc:postgresql://ep-cool-meadow-b387gbbo-pooler.c-4.ap-southeast-1.aws.neon.tech/neondb?sslmode=require&channel_binding=require
    username: neondb_owner
    password: npg_rKQwEhz0tcZ9
    driver-class-name: org.postgresql.Driver
  jpa:
    show-sql: true

